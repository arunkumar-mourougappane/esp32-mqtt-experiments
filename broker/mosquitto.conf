# Tab5 IMU broker. Generate certs/passwd first with broker/setup-tls.sh.
per_listener_settings true
persistence false
log_dest stdout

# Devices: TLS, password required, may only use tab5/#.
listener 8883 0.0.0.0
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.devices

# Browser viewer: plain WebSockets, published on 127.0.0.1 only (see run.sh), read-only.
listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl.viewer
