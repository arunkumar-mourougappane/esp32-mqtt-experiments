# Tab5 IMU broker. Generate certs/passwd first with broker/setup-tls.sh.
per_listener_settings true
persistence false
log_dest stdout

# Devices: TLS, password required, may only use tab5/#.
listener 8883 0.0.0.0
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.devices

# Devices that sign in with a certificate (mutual TLS): the client must present a certificate issued by our CA
# (broker/issue-device-cert.sh), and its common name becomes the MQTT username. No password is asked for.
listener 8884 0.0.0.0
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
acl_file /mosquitto/config/acl.certs

# Browser viewer: plain WebSockets, published on 127.0.0.1 only (see run.sh), read-only.
listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl.viewer
