; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; M5Stack Tab5 (ESP32-P4). The official espressif32 platform lacks P4 support,
; so this uses the pioarduino fork, which ships the m5stack-tab5-p4 board.
; Note: that board definition targets the "ES pre rev.300" P4 silicon.

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
; The board JSON asks for this table but PlatformIO ignores it, falling back to the
; 1.25 MB default.csv. 16 MB flash: two 6.4 MB OTA app slots + 3.4 MB spiffs.
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ 0.3.0
    m5stack/M5GFX @ 0.3.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0

[platformio]
default_envs = m5stack-tab5

; Throwaway experiments for the setup and quick-settings work (not product code).
; Build and flash with: pio run -e spike -t upload
[env:spike]
extends = env:m5stack-tab5
build_src_filter = -<*> +<../spike/spike.cpp>

; On-device self-test of the settings storage (encryption, PIN, what is readable in flash).
; Build and flash with: pio run -e provtest -t upload
[env:provtest]
extends = env:m5stack-tab5
build_src_filter = -<*> +<prov.cpp> +<../spike/provtest.cpp>

; The setup mode (access point, QR, setup page) on its own, without the rest of the firmware.
; Build and flash with: pio run -e setuptest -t upload
[env:setuptest]
extends = env:m5stack-tab5
build_src_filter = -<*> +<prov.cpp> +<setup_mode.cpp> +<../spike/setuptest.cpp>

; Reads the M5Stack I2C Joystick 2 Unit on Port A and prints its raw values.
; Build and flash with: pio run -e joytest -t upload
[env:joytest]
extends = env:m5stack-tab5
build_src_filter = -<*> +<../spike/joytest.cpp>
